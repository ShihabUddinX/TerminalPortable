name: Update Windows Terminal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-windows-terminal
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest stable release
        id: release
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/microsoft/terminal/releases/latest" `
            -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Unexpected release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          Write-Host "Latest stable version: $version"

      - name: Download and validate architecture ZIPs
        id: download
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $temp = Join-Path $env:RUNNER_TEMP "terminal-update"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/microsoft/terminal/releases/latest" `
            -Headers $headers

          $architectures = @{
            x86    = "Terminal"
            x64    = "Terminal64"
            arm64  = "TerminalARM64"
          }

          foreach ($arch in $architectures.Keys) {
            $filename = "Microsoft.WindowsTerminal_${version}_${arch}.zip"

            $asset = $release.assets |
              Where-Object { $_.name -eq $filename } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Required release asset not found: $filename"
            }

            $destination = Join-Path $temp $filename

            Write-Host "Downloading $filename"
            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile $destination

            if ((Get-Item $destination).Length -eq 0) {
              throw "Downloaded file is empty: $filename"
            }

            $extract = Join-Path $temp $arch
            New-Item -ItemType Directory -Force -Path $extract | Out-Null

            Expand-Archive `
              -LiteralPath $destination `
              -DestinationPath $extract `
              -Force

            $exe = Get-ChildItem $extract `
              -Filter "WindowsTerminal.exe" `
              -File -Recurse |
              Select-Object -First 1

            if (-not $exe) {
              throw "WindowsTerminal.exe missing from $filename"
            }

            $source = $exe.Directory.FullName
            $target = Join-Path "TerminalPortable/App" $architectures[$arch]

            if (-not (Test-Path $target)) {
              New-Item -ItemType Directory -Force -Path $target | Out-Null
            }

            # Preserve portable settings and the portable-mode marker.
            Get-ChildItem -LiteralPath $target -Force |
              Where-Object {
                $_.Name -ne ".portable" -and $_.Name -ne "settings"
              } |
              Remove-Item -Recurse -Force

            # Copy the extracted package files.
            Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $target `
              -Recurse -Force

            # Copy any other extracted files/directories if the archive
            # contains assets alongside the executable's directory.
            Get-ChildItem -LiteralPath $extract -Force |
              Where-Object { $_.FullName -ne $source } |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName `
                  -Destination $target -Recurse -Force
              }

            Write-Host "Updated $target"
          }

      - name: Update appinfo.ini version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $displayVersion = $version -replace '\.0$', ''

          # Find appinfo.ini automatically in the repository.
          $files = Get-ChildItem -Path . -Filter "appinfo.ini" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }

          if (-not $files) {
            throw "appinfo.ini was not found anywhere in the repository."
          }

          $file = $files | Select-Object -First 1
          $path = $file.FullName

          Write-Host "Updating: $path"

          $lines = Get-Content -LiteralPath $path
          $inVersion = $false
          $foundPackage = $false
          $foundDisplay = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i].Trim()

            if ($line -match '^\[Version\]$') {
              $inVersion = $true
              continue
            }

            if ($line -match '^\[.+\]$') {
              $inVersion = $false
            }

            if ($inVersion -and $line -match '^PackageVersion\s*=') {
              $lines[$i] = "PackageVersion=$version"
              $foundPackage = $true
            }

            if ($inVersion -and $line -match '^DisplayVersion\s*=') {
              $lines[$i] = "DisplayVersion=$displayVersion"
              $foundDisplay = $true
            }
          }

          if (-not $foundPackage -or -not $foundDisplay) {
            throw "PackageVersion or DisplayVersion was not found in the [Version] section of $path"
          }

          Set-Content -LiteralPath $path -Value $lines -Encoding UTF8

          Write-Host "Updated PackageVersion=$version"
          Write-Host "Updated DisplayVersion=$displayVersion"

      - name: Commit and push changes
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TerminalPortable/App/Terminal `
                  TerminalPortable/App/Terminal64 `
                  TerminalPortable/App/TerminalARM64 `
                  TerminalPortable/App/AppInfo/appinfo.ini

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            git commit -m "Update Windows Terminal to ${{ steps.release.outputs.version }}"
            git push
            "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Create portable package
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $package = Join-Path $env:RUNNER_TEMP "TerminalPortable-$version.zip"

          if (-not (Test-Path "TerminalPortable")) {
            throw "TerminalPortable directory not found."
          }

          Compress-Archive `
            -Path "TerminalPortable" `
            -DestinationPath $package `
            -CompressionLevel Optimal `
            -Force

          "PACKAGE_PATH=$package" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "v$version"

          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping duplicate release."
            exit 0
          }

          gh release create $tag "$env:PACKAGE_PATH" `
            --repo "${{ github.repository }}" `
            --title "TerminalPortable $version" `
            --notes "Updated portable Windows Terminal builds for x86, x64, and ARM64."
