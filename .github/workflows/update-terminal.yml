name: Update Windows Terminal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-windows-terminal
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest stable release
        id: release
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/microsoft/terminal/releases/latest" `
            -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Unexpected release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          Write-Host "Latest stable version: $version"

      - name: Download and validate architecture ZIPs
        id: download
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $temp = Join-Path $env:RUNNER_TEMP "terminal-update"

          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $architectures = @{
            x86   = "Terminal"
            x64   = "Terminal64"
            arm64 = "TerminalARM64"
          }

          foreach ($arch in @("x86", "x64", "arm64")) {
            $filename = "Microsoft.WindowsTerminal_${version}_${arch}.zip"
            $url = "https://github.com/microsoft/terminal/releases/latest/download/$filename"
            $zip = Join-Path $temp $filename
            $extract = Join-Path $temp $arch

            Write-Host "Downloading: $url"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -MaximumRedirection 10

            if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
              throw "Download failed or ZIP is empty: $filename"
            }

            # Validate ZIP integrity before extracting.
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              if ($archive.Entries.Count -eq 0) {
                throw "ZIP archive is empty: $filename"
              }
            }
            finally {
              $archive.Dispose()
            }

            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

            $exe = Get-ChildItem -LiteralPath $extract `
              -Filter "WindowsTerminal.exe" -File -Recurse |
              Select-Object -First 1

            if (-not $exe) {
              throw "WindowsTerminal.exe not found in $filename"
            }

            $source = $exe.Directory.FullName
            $target = Join-Path "App" $architectures[$arch]

            if (-not (Test-Path $target)) {
              New-Item -ItemType Directory -Force -Path $target | Out-Null
            }

            # Remove old application files but preserve portable settings.
            Get-ChildItem -LiteralPath $target -Force |
              Where-Object {
                $_.Name -ne ".portable" -and $_.Name -ne "settings"
              } |
              Remove-Item -Recurse -Force

            Copy-Item -Path (Join-Path $source "*") `
              -Destination $target -Recurse -Force

            # Copy remaining top-level archive contents if present.
            Get-ChildItem -LiteralPath $extract -Force |
              Where-Object { $_.FullName -ne $source } |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName `
                  -Destination $target -Recurse -Force
              }

            Write-Host "Updated $target from $filename"
          }

      - name: Update appinfo.ini version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $displayVersion = $version -replace '\.0$', ''

          # Find appinfo.ini automatically in the repository.
          $files = Get-ChildItem -Path . -Filter "appinfo.ini" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }

          if (-not $files) {
            throw "appinfo.ini was not found anywhere in the repository."
          }

          $file = $files | Select-Object -First 1
          $path = $file.FullName

          Write-Host "Updating: $path"

          $lines = Get-Content -LiteralPath $path
          $inVersion = $false
          $foundPackage = $false
          $foundDisplay = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i].Trim()

            if ($line -match '^\[Version\]$') {
              $inVersion = $true
              continue
            }

            if ($line -match '^\[.+\]$') {
              $inVersion = $false
            }

            if ($inVersion -and $line -match '^PackageVersion\s*=') {
              $lines[$i] = "PackageVersion=$version"
              $foundPackage = $true
            }

            if ($inVersion -and $line -match '^DisplayVersion\s*=') {
              $lines[$i] = "DisplayVersion=$displayVersion"
              $foundDisplay = $true
            }
          }

          if (-not $foundPackage -or -not $foundDisplay) {
            throw "PackageVersion or DisplayVersion was not found in the [Version] section of $path"
          }

          Set-Content -LiteralPath $path -Value $lines -Encoding UTF8

          Write-Host "Updated PackageVersion=$version"
          Write-Host "Updated DisplayVersion=$displayVersion"

      - name: Commit and push changes
        shell: pwsh
        run: |
          git config user.name "ShihabUddinX"
          git config user.email "ShihabUddinX@users.noreply.github.com"

          # Stage all tracked and newly downloaded files.
          git add -A

          # Show exactly what will be committed.
          git status --short

          if (git diff --cached --quiet) {
            Write-Host "No changes detected. Nothing to commit."
            exit 0
          }

          git commit -m "Update Windows Terminal to ${{ steps.release.outputs.version }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed."
          }

          git push origin "HEAD:${{ github.ref_name }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Git push failed."
          }

          Write-Host "Changes committed and pushed successfully."
