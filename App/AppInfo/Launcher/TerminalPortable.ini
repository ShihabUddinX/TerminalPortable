[Launch]
ProgramExecutable=Terminal\WindowsTerminal.exe
ProgramExecutable64=Terminal64\WindowsTerminal.exe
ProgramExecutableARM64=TerminalARM64\WindowsTerminal.exe
;If u Change the ProgramExecutable's WindowsTerminal.exe with wt,exe then the settings.json will be curropted 
CommandLineArguments=--inheritEnvironment
SplashTime=1000
LaunchAppAfterSplash=true
SupportsUNC=yes
DirectoryMoveOK=yes

[Activate]
Java=find

[Environment]
PATH=%JAVA_HOME%;%PAL:DataDir%\tools;%PATH%

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\settings\settings.json
Find=%PAL:LastDrive%\\
Replace=%PAL:Drive%\\

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\settings\settings.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\settings\settings.json
Find=%PAL:LastPortableAppsBaseDir%\\
Replace=%PAL:PortableAppsBaseDir%\\

;[FileWrite4]
;Type=Replace
;File=%PAL:DataDir%\settings\settings.json
;Find="compatibility.reloadEnvironmentVariables": true,
;Replace="compatibility.reloadEnvironmentVariables": false,

[DirectoriesCleanupIfEmpty]
1=%FullAppDir%\settings

[FilesMove]
settings\settings.json=%FullAppDir%\settings
settings\state.json=%FullAppDir%\settings
settings\defaults.json=%FullAppDir%